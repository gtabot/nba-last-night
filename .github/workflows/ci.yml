name: Check

# Validates data, runs the tests and makes sure the page builds.
# Publishing to theycallmegtab.dev is done by scripts/publish_site.py (see README).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build site
        run: python scripts/build.py --out dist
      - name: Keep the build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
